<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 知微墨序</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#111213;color:#e9e4da;font-family:system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;padding:38px 30px;border:1px solid #50422f;border-radius:16px;background:#191a1b}img{width:48px}h1{font-size:28px;font-weight:500;color:#e3c68e;letter-spacing:4px}p{color:#afa38e;line-height:1.8;font-size:14px}label{display:block;margin:28px 0 10px}input,button{width:100%;padding:14px;font:inherit;border-radius:7px}input{background:#22221f;border:1px solid #77623e;color:#fff}button{margin-top:20px;border:0;background:#d6b87d;color:#282014;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid #e3c68e;outline-offset:3px}#message{min-height:24px;color:#e7b79f}</style><main><img src="/icon.svg" alt=""><h1>知微 · 墨序</h1><p>记录日常，安排计划。<br>登录后进入你的个人空间。</p><form id="login"><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button>进入知微墨序</button><p id="message" role="status"></p></form></main><script src="/login.js"></script></html>
